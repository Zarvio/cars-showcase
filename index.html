<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <title>Pinora</title>
  <link rel="icon" type="image/png" href="default.jpg">

  <!-- JS band ho ya fail ho jaye to bhi main page khul jaye -->
  <noscript><meta http-equiv="refresh" content="1;url=main.html"></noscript>

  <style>
    :root{
      --bg:#0b0b0f; --surface:#15151b; --line:#2a2a34;
      --text:#f5f5f7; --muted:#9a9aa8; --accent:#ff2d55;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}

    #introOverlay{
      position:fixed;inset:0;z-index:9999;
      display:flex;justify-content:center;align-items:center;
      padding:24px;
      background:radial-gradient(circle at 50% 40%,#1a1a24 0%,var(--bg) 65%);
      transition:opacity .5s ease;
      cursor:pointer;
    }
    #introOverlay.hide{opacity:0;pointer-events:none}

    .introContent{display:flex;flex-direction:column;align-items:center;text-align:center}

    #introLogo{
      width:min(55vw,220px);height:min(55vw,220px);
      object-fit:cover;border-radius:50%;
      border:3px solid var(--line);
      background:var(--surface);
      box-shadow:0 0 60px rgba(255,45,85,.28);
      opacity:0;transform:scale(.5);
      animation:logoIn 1.2s cubic-bezier(.2,.8,.2,1) .1s forwards;
    }
    @keyframes logoIn{
      0%{opacity:0;transform:scale(.5)}
      60%{opacity:1;transform:scale(1.08)}
      100%{opacity:1;transform:scale(1)}
    }

    .brand{
      margin-top:22px;font-size:34px;font-weight:800;letter-spacing:-.5px;
      opacity:0;animation:fadeUp .6s ease .7s forwards;
    }
    .versionText{
      margin-top:8px;font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.5px;
      opacity:0;animation:fadeUp .6s ease .9s forwards;
    }
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }

    .loadBar{
      margin-top:28px;width:120px;height:4px;border-radius:4px;
      background:var(--surface);overflow:hidden;
      opacity:0;animation:fadeUp .6s ease 1s forwards;
    }
    .loadBar span{
      display:block;height:100%;width:0;border-radius:4px;
      background:linear-gradient(90deg,var(--accent),#ffb800);
      animation:fill 1.9s ease-out 1.1s forwards;
    }
    @keyframes fill{to{width:100%}}

    @media (prefers-reduced-motion:reduce){
      #introLogo,.brand,.versionText,.loadBar{animation:none;opacity:1;transform:none}
      .loadBar span{animation:none;width:100%}
    }
  </style>
</head>
<body>

<!-- Intro Overlay -->
<div id="introOverlay">
  <div class="introContent">
    <img src="default.jpg" alt="Pinora Logo" id="introLogo">
    <div class="brand">Pinora</div>
    <div class="versionText">Version 3.0</div>
    <div class="loadBar"><span></span></div>
  </div>
</div>

<script>
(function () {
  const TARGET = "main.html";
  const SHOW_MS = 3000;   // splash kitni der dikhe
  let done = false;

  // logo na mile to default dp.jpg, wo bhi na mile to chhupa do (broken icon na dikhe)
  const logo = document.getElementById("introLogo");
  logo.addEventListener("error", function () {
    if (!logo.dataset.retry) { logo.dataset.retry = "1"; logo.src = "dp.jpg"; }
    else logo.style.visibility = "hidden";
  });

  function go() {
    if (done) return;       // sirf ek hi baar chale
    done = true;
    const overlay = document.getElementById("introOverlay");
    overlay.classList.add("hide");
    // replace: back dabane par dobara splash pe na aaye
    setTimeout(() => location.replace(TARGET), 450);
  }

  // ek hi timer (pehle 2 alag timers the)
  setTimeout(go, SHOW_MS);

  // tap / click / Enter karne par splash skip
  document.getElementById("introOverlay").addEventListener("click", go);
  document.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") go(); });
})();
</script>

</body>
</html>
